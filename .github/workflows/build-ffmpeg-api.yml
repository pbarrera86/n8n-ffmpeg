name: Build and publish ffmpeg-api

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ffmpeg-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push (ffmpeg-api)
        uses: docker/build-push-action@v6
        with:
          context: ./ffmpeg-api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
