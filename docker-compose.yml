services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  ffmpeg-api:
    build:
      context: ./ffmpeg-api
      dockerfile: Dockerfile
    restart: unless-stopped
    pull_policy: build
    environment:
      - FFMPEG_API_KEY=${FFMPEG_API_KEY}
      - AUDIO_DIR=/audio
      - IMAGE_DIR=/images
      - FONT_FILE=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - FONT_FILE_REGULAR=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - TTS_DEFAULT_VOICE=es-la
      - TTS_DEFAULT_SPEED=170
      - TTS_DEFAULT_VOLUME=100
    volumes:
      - ffmpeg_audios:/audio:rw
      - ffmpeg_images:/images:rw
      - ffmpeg_tmp:/tmp/ffmpeg
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - internal_net

  n8n:
    image: ghcr.io/pbarrera86/n8n-ffmpeg:2.18.7
    pull_policy: always
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SSL=false
      - DB_POSTGRESDB_SCHEMA=public

      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/

      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_SECURE_COOKIE=true
      - N8N_PROXY_HOPS=1
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_USER_FOLDER=/home/node/.n8n

      # En n8n 2.18.7 ya no pongas N8N_RUNNERS_ENABLED
      - N8N_RUNNERS_MODE=internal

      - EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS}
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE}
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=${EXECUTIONS_DATA_PRUNE_MAX_COUNT}
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=${N8N_CONCURRENCY_PRODUCTION_LIMIT}

      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_STORAGE_PATH=/home/node/.n8n/binaryData

      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TIKTOK_ACCESS_TOKEN=${TIKTOK_ACCESS_TOKEN}
      - FFMPEG_API_KEY=${FFMPEG_API_KEY}

    volumes:
      - n8n_data:/home/node/.n8n
      - tiktok_ai_data:/data/tiktok_ai

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    depends_on:
      postgres:
        condition: service_healthy
      ffmpeg-api:
        condition: service_healthy

    networks:
      - internal_net
      - dokploy-network

volumes:
  n8n_data:
  postgres_data:
  tiktok_ai_data:
  ffmpeg_tmp:
  ffmpeg_audios:
  ffmpeg_images:

networks:
  internal_net:
    driver: bridge

  dokploy-network:
    external: true
