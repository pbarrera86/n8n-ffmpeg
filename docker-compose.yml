services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  ffmpeg-api:
    build:
      context: ./ffmpeg-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - FFMPEG_API_KEY=${FFMPEG_API_KEY}
      - AUDIO_DIR=/audio
      - IMAGE_DIR=/images
      - FONT_FILE=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - FONT_FILE_REGULAR=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    volumes:
      - ./audios:/audio:rw
      - ./images:/images:rw
      - ffmpeg_tmp:/tmp/ffmpeg
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - internal_net

  piper-tts:
    image: artibex/piper-http:latest
    restart: unless-stopped
    environment:
      - MODEL_DOWNLOAD_LINK=${PIPER_MODEL_DOWNLOAD_LINK}
    volumes:
      - ./piper_models:/app/models:rw
    command:
      - sh
      - -lc
      - |
        set -e
        echo "[piper] MODEL_DOWNLOAD_LINK=$MODEL_DOWNLOAD_LINK"
        mkdir -p /app/models

        echo "[piper] downloading model + json (if missing)..."
        python - <<'PY'
import os, urllib.request, sys

model_url = os.environ.get("MODEL_DOWNLOAD_LINK","").strip()
if not model_url:
    print("MODEL_DOWNLOAD_LINK is empty"); sys.exit(1)

model_path = "/app/models/model.onnx"
json_path  = "/app/models/model.onnx.json"

# Deriva URL del JSON
# Ej: .../es_MX-ald-medium.onnx?download=true  -> .../es_MX-ald-medium.onnx.json
json_url = model_url.replace(".onnx?download=true", ".onnx.json").replace(".onnx?download=1", ".onnx.json")
if json_url == model_url:
    # si viene sin ?download=true, intenta simple
    json_url = model_url.replace(".onnx", ".onnx.json")

def download(url, path):
    print(f"Downloading {url} -> {path}")
    urllib.request.urlretrieve(url, path)

if not os.path.exists(model_path):
    download(model_url, model_path)
else:
    print("Model already exists:", model_path)

if not os.path.exists(json_path):
    download(json_url, json_path)
else:
    print("Config already exists:", json_path)

print("Files in /app/models:", os.listdir("/app/models"))
PY

        echo "[piper] patching phoneme_type (PhonemeType.ESPEAK -> espeak) ..."
        python - <<'PY'
import json, os
p = "/app/models/model.onnx.json"
with open(p, "r", encoding="utf-8") as f:
    cfg = json.load(f)

pt = cfg.get("phoneme_type")
if pt == "PhonemeType.ESPEAK":
    cfg["phoneme_type"] = "espeak"
    with open(p, "w", encoding="utf-8") as f:
        json.dump(cfg, f, ensure_ascii=False)
    print("patched phoneme_type to espeak")
else:
    print("phoneme_type is:", pt)
PY

        echo "[piper] starting server on :5000 ..."
        python -m piper.http_server --model /app/models/model.onnx --config /app/models/model.onnx.json --host 0.0.0.0 --port 5000
    networks:
      - internal_net

  n8n:
    image: ghcr.io/pbarrera86/n8n-ffmpeg:2.6.3
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SSL=false
      - DB_POSTGRESDB_SCHEMA=public
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_SECURE_COOKIE=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS}
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE}
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=${EXECUTIONS_DATA_PRUNE_MAX_COUNT}
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=${N8N_CONCURRENCY_PRODUCTION_LIMIT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TIKTOK_ACCESS_TOKEN=${TIKTOK_ACCESS_TOKEN}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_STORAGE_PATH=/home/node/.n8n/binaryData
      - N8N_PROXY_HOPS=1
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_USER_FOLDER=/home/node/.n8n
      - FFMPEG_API_KEY=${FFMPEG_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - tiktok_ai_data:/data/tiktok_ai
    depends_on:
      postgres:
        condition: service_healthy
      ffmpeg-api:
        condition: service_healthy
    networks:
      - internal_net

volumes:
  n8n_data:
  postgres_data:
  tiktok_ai_data:
  ffmpeg_tmp:

networks:
  internal_net:
    driver: bridge
